# Dev infrastructure only: PostgreSQL. Applications run on the host (`pnpm dev`).
name: e-deep

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env (see .env.example)}
    ports:
      # Bound to localhost only: the dev database is never exposed on the network.
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      # Postgres >= 18 images store data under /var/lib/postgresql/<major>/docker.
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  db-data:
